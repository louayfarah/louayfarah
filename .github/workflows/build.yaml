name: README build

# Refreshes the numbers on the profile card once a day.
# Needs one repository secret, ACCESS_TOKEN: a personal access token that can read every
# repository to count (classic token: scopes repo, read:org, read:user).
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # The per-repository counts are kept here, never in git: they would show how many private
      # repositories there are and how much was committed to each.
      - name: Restore the lines-of-code cache
        uses: actions/cache@v4
        with:
          path: cache
          key: loc-cache-${{ github.run_id }}
          restore-keys: loc-cache-
      - name: Update the card
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python today.py
      - name: Commit
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git commit -m "Update profile card" || echo "No changes to commit"
          git push
